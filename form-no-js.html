  <main>
    <h2>I would love to hear from you!</h2>
    <form action="https://httpbin.org/post" method="post" name="contact">
      <fieldset>
        <legend>Send a message</legend>
        <p>
          <label for="name">Name</label>
          <small id="name-hint">Enter your full name.</small>
          <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-hint" required>
        </p>

        <p>
          <label for="email">Email</label>
          <small id="email-hint">Enter your email address.</small>
          <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-hint" required>
        </p>

        <p>
          <label for="comments">Comments</label>
          <small id="comments-hint">Tell me what you'd like to talk about.</small>
          <textarea id="comments" name="comments" rows="5" aria-describedby="comments-hint" required></textarea>
        </p>

        <input type="hidden" name="possible_bot" value="true">

        <button type="submit">Send</button>
      </fieldset>
    </form>
  </main>

  <footer>
